name: Private release to vid-pipeline

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Optional release tag/name/id; empty selects newest draft release with assets
        required: false
        default: ""
        type: string
      asset_name:
        description: Optional exact asset name; empty selects the first asset
        required: false
        default: ""
        type: string
      mode:
        description: Benchmark download only or process the selected video
        required: true
        default: benchmark
        type: choice
        options: [benchmark, process]
      profile:
        required: true
        default: balanced
        type: choice
        options: [fast, balanced, accurate]
      diarization:
        required: true
        default: false
        type: boolean
      num_speakers:
        required: true
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      INPUT_MEDIA: /tmp/private-release-input/media
      RELEASE_REF: ${{ inputs.release_ref }}
      ASSET_NAME: ${{ inputs.asset_name }}
      MODE: ${{ inputs.mode }}
      PROFILE: ${{ inputs.profile }}
      DIARIZATION: ${{ inputs.diarization }}
      NUM_SPEAKERS: ${{ inputs.num_speakers }}

    steps:
      - name: Checkout public pipeline code
        uses: actions/checkout@v4
        with:
          repository: Shahbazi-Amir/vid_pipeline
          ref: main
          path: vid_pipeline

      - name: Resolve and download private release asset
        id: media
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$INPUT_MEDIA")"
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          api = "https://api.github.com"
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "private-release-to-vid-pipeline",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          releases = get_json(f"{api}/repos/{repo}/releases?per_page=100")
          ref = os.environ.get("RELEASE_REF", "").strip()
          selected = None
          selected_assets = []
          for release in releases:
              if ref and not (
                  str(release.get("id")) == ref
                  or str(release.get("tag_name") or "") == ref
                  or str(release.get("name") or "") == ref
              ):
                  continue
              assets = get_json(
                  f"{api}/repos/{repo}/releases/{int(release['id'])}/assets?per_page=100"
              )
              if assets:
                  selected = release
                  selected_assets = assets
                  break
          if selected is None:
              raise SystemExit("No matching release with assets was found in the private repository")

          requested_name = os.environ.get("ASSET_NAME", "").strip()
          if requested_name:
              asset = next((item for item in selected_assets if item.get("name") == requested_name), None)
              if asset is None:
                  raise SystemExit(
                      f"Asset not found: {requested_name!r}; available={[item.get('name') for item in selected_assets]!r}"
                  )
          else:
              asset = selected_assets[0]

          asset_id = int(asset["id"])
          download_headers = dict(headers)
          download_headers["Accept"] = "application/octet-stream"
          request = urllib.request.Request(
              f"{api}/repos/{repo}/releases/assets/{asset_id}",
              headers=download_headers,
          )
          target = os.environ["INPUT_MEDIA"]
          digest = hashlib.sha256()
          started = time.monotonic()
          with urllib.request.urlopen(request, timeout=120) as response, open(target + ".part", "wb") as output:
              while chunk := response.read(1024 * 1024):
                  digest.update(chunk)
                  output.write(chunk)
          elapsed = max(time.monotonic() - started, 0.001)
          os.replace(target + ".part", target)
          size = os.path.getsize(target)

          expected_size = int(asset.get("size", -1))
          if expected_size >= 0 and size != expected_size:
              raise SystemExit(f"Downloaded size mismatch: {size} != {expected_size}")
          actual_digest = digest.hexdigest()
          expected_digest = str(asset.get("digest") or "")
          if expected_digest.startswith("sha256:") and expected_digest != f"sha256:{actual_digest}":
              raise SystemExit("Downloaded SHA-256 does not match release metadata")

          report = {
              "repository_visibility": "private",
              "release_id": int(selected["id"]),
              "release_is_draft": bool(selected.get("draft")),
              "asset_id": asset_id,
              "asset_name": asset.get("name"),
              "size_bytes": size,
              "download_seconds": round(elapsed, 3),
              "download_mib_per_second": round(size / 1024 / 1024 / elapsed, 3),
              "sha256": actual_digest,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"asset_name={asset.get('name')}\n")
              output.write(f"download_seconds={elapsed:.3f}\n")
              output.write(f"download_mib_per_second={size / 1024 / 1024 / elapsed:.3f}\n")
          PY

      - name: Show benchmark result
        if: inputs.mode == 'benchmark'
        shell: bash
        run: |
          echo "Asset: ${{ steps.media.outputs.asset_name }}"
          echo "Download seconds: ${{ steps.media.outputs.download_seconds }}"
          echo "MiB/s: ${{ steps.media.outputs.download_mib_per_second }}"

      - uses: actions/setup-python@v5
        if: inputs.mode == 'process'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vid_pipeline/pyproject.toml

      - name: Install pipeline worker dependencies
        if: inputs.mode == 'process'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          if [[ "${DIARIZATION,,}" == "true" ]]; then
            pip install -e './vid_pipeline[worker,diarization-pyannote]'
          else
            pip install -e './vid_pipeline[worker]'
          fi

      - name: Process video with public pipeline code
        if: inputs.mode == 'process'
        shell: bash
        env:
          VID_PIPELINE_PYANNOTE_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          args=(run-file "$INPUT_MEDIA" --name "private-${{ github.run_id }}" --output-root outputs \
            --profile "$PROFILE" --language fa --device cpu --compute-type int8 --no-editorial)
          if [[ "${DIARIZATION,,}" == "true" ]]; then
            args+=(--diarize --num-speakers "$NUM_SPEAKERS")
          fi
          vid-pipeline "${args[@]}"

      - name: Upload transcript result privately
        if: inputs.mode == 'process' && success()
        uses: actions/upload-artifact@v4
        with:
          name: private-release-transcript-${{ github.run_id }}
          path: outputs/**/delivery/*
          retention-days: 7
          if-no-files-found: error

      - name: Remove temporary media
        if: always()
        shell: bash
        run: |
          rm -f -- "$INPUT_MEDIA" "$INPUT_MEDIA.part"
