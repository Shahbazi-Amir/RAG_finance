name: Build Windows Distribution

on:
  workflow_dispatch:
  push:
    branches:
      - phase1-windows
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name != 'pull_request' || github.head_ref == 'phase1-windows'
    runs-on: windows-latest

    steps:
      - name: Checkout phase1-windows
        uses: actions/checkout@v4

      - name: Verify protected branch scope
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $branch = "${{ github.head_ref }}"
          }
          else {
            $branch = (git branch --show-current).Trim()
          }
          if ($branch -ne "phase1-windows") {
            throw "Expected phase1-windows, got '$branch'."
          }

      - name: Materialize and validate runtime API config
        shell: pwsh
        env:
          RAG_FINANCE_ENV_CONTENT: ${{ secrets.RAG_FINANCE_ENV }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RAG_FINANCE_ENV_CONTENT)) {
            throw "RAG_FINANCE_ENV secret is missing or empty."
          }

          [System.IO.File]::WriteAllText(
            (Join-Path $PWD ".env"),
            $env:RAG_FINANCE_ENV_CONTENT,
            [System.Text.UTF8Encoding]::new($false)
          )

          $content = [System.IO.File]::ReadAllText((Join-Path $PWD ".env"))
          $required = @(
            "ARVAN_AI_API_KEY",
            "ARVAN_EMBEDDING_URL",
            "ARVAN_CHAT_URL"
          )
          foreach ($name in $required) {
            $pattern = "(?m)^\s*" + [regex]::Escape($name) + "\s*=\s*(?!\s*$).+"
            if (-not [regex]::IsMatch($content, $pattern)) {
              throw "Runtime config is missing or empty for required key: $name"
            }
          }

          Write-Host "Runtime API config key-name validation passed."

      - name: Prepare and validate Phase 1 vector store seed
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            .\packaging\windows\prepare_vectorstore_seed.ps1 -CommitSeed
          }
          else {
            .\packaging\windows\prepare_vectorstore_seed.ps1
          }

      - name: Verify temporary ZIP is gone
        shell: pwsh
        run: |
          if (Test-Path ".\qdrant_local.zip") {
            throw "Temporary qdrant_local.zip must not remain after seed preparation."
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m compileall -q app.py config src packaging/windows

      - name: Verify runtime vector store seed
        shell: pwsh
        run: |
          $seed = ".\packaging\windows\resources\qdrant_local"
          $meta = Join-Path $seed "meta.json"
          $collection = Join-Path $seed "collection\financial_knowledge_base"
          $storage = Join-Path $collection "storage.sqlite"

          foreach ($required in @($seed, $meta, $collection, $storage)) {
            if (-not (Test-Path $required)) {
              throw "Production build blocked: required vector seed path is missing: $required"
            }
          }

          if ((Get-Item $storage).Length -le 0) {
            throw "Production build blocked: storage.sqlite is empty."
          }

          $locks = @(Get-ChildItem -Path $seed -Recurse -Force -File -Filter ".lock" -ErrorAction SilentlyContinue)
          if ($locks.Count -gt 0) {
            throw "Production build blocked: vector seed contains .lock."
          }

          Write-Host "Vector seed storage.sqlite bytes: $((Get-Item $storage).Length)"

      - name: Build portable application
        shell: pwsh
        run: .\packaging\windows\build.ps1

      - name: Smoke test portable EXE
        shell: pwsh
        run: |
          .\packaging\windows\smoke_test.ps1 `
            -ExePath ".\dist\RAG-Finance\RAG-Finance.exe" `
            -Port 8501

      - name: Validate portable structure
        shell: pwsh
        run: python .\packaging\windows\verify_bundle.py .\dist\RAG-Finance

      - name: Real end-to-end RAG test for portable build
        shell: pwsh
        run: |
          python .\packaging\windows\e2e_rag_test.py `
            --distribution-root ".\dist\RAG-Finance"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ".\dist\RAG-Finance" `
            -DestinationPath ".\RAG-Finance-Windows.zip" `
            -Force
          Write-Host "Portable ZIP bytes: $((Get-Item '.\RAG-Finance-Windows.zip').Length)"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAG-Finance-Windows-Portable
          path: RAG-Finance-Windows.zip
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found: $iscc"
          }
          & $iscc ".\packaging\windows\installer.iss"

      - name: Validate installer
        shell: pwsh
        run: |
          $setup = ".\dist\installer\RAG-Finance-Setup.exe"
          if (-not (Test-Path $setup)) {
            throw "Installer was not created."
          }

          Write-Host "Installer bytes: $((Get-Item $setup).Length)"

          $validationId = [guid]::NewGuid().ToString("N")
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\RAG Finance"
          $installLog = Join-Path $env:RUNNER_TEMP ("RAGFinance-Install-" + $validationId + ".log")
          $proc = Start-Process `
            -FilePath $setup `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$installLog" `
            -Wait `
            -PassThru

          if ($proc.ExitCode -ne 0) {
            if (Test-Path $installLog) {
              Write-Host "----- Inno Setup install log -----"
              Get-Content $installLog
              Write-Host "----- End install log -----"
            }
            throw "Silent installer failed with exit code $($proc.ExitCode)."
          }

          $installedExe = Join-Path $installDir "RAG-Finance.exe"
          if (-not (Test-Path $installedExe)) {
            throw "Installed executable not found."
          }

          .\packaging\windows\smoke_test.ps1 `
            -ExePath $installedExe `
            -Port 8501

          python .\packaging\windows\e2e_rag_test.py `
            --distribution-root $installDir

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstaller) {
            $uninstallLog = Join-Path $env:RUNNER_TEMP ("RAGFinance-Uninstall-" + $validationId + ".log")
            $uninstallProc = Start-Process `
              -FilePath $uninstaller `
              -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$uninstallLog" `
              -Wait `
              -PassThru
            if ($uninstallProc.ExitCode -ne 0) {
              if (Test-Path $uninstallLog) {
                Get-Content $uninstallLog
              }
              throw "Silent uninstall failed with exit code $($uninstallProc.ExitCode)."
            }
          }

          try {
            if (Test-Path $installDir) {
              Remove-Item -Path $installDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          catch {
            Write-Host "Installer validation cleanup skipped: $($_.Exception.Message)"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAG-Finance-Windows-Installer
          path: dist/installer/RAG-Finance-Setup.exe
          if-no-files-found: error

      - name: Remove checkout runtime config
        if: always()
        shell: pwsh
        run: Remove-Item ".env" -Force -ErrorAction SilentlyContinue
